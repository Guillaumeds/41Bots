<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vast machine watcher</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #d9dee6;
    --accent: #1f6feb; --good: #1a7f37; --bad: #b42318; --new: #fff4cc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161d; --card: #1b212b; --ink: #e8ecf2; --muted: #9aa6b8; --line: #2c3544;
            --accent: #5aa2ff; --good: #4ac26b; --bad: #ff7b72; --new: #4a3f12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
  label.f { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
  label.f input[type=text], label.f input[type=number], label.f select {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; }
  label.f input[type=text] { width: 280px; max-width: 100%; }
  label.f input[type=number] { width: 100px; }
  label.c { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* on/off switch */
  .switch { display: flex; align-items: center; gap: 12px; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track { width: 58px; height: 30px; border-radius: 15px; background: var(--line);
           position: relative; transition: background .15s; cursor: pointer; flex: none; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
                  border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px #0005; }
  .switch input:checked + .track { background: var(--good); }
  .switch input:checked + .track::after { left: 31px; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .state { font-weight: 600; min-width: 190px; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--bad); }
  .warn { color: var(--bad); font-size: 13px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr.new td { background: var(--new); }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: var(--accent);
           color: #fff; margin-left: 6px; }
  .ok { color: var(--good); } .no { color: var(--muted); }
  .empty { color: var(--muted); padding: 14px 4px; }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Vast machine watcher</h1>
  <p class="sub">Tells you when a machine you are waiting for appears on the vast.ai market. It only searches; it never rents anything.</p>

  <section class="card" aria-label="Notifications">
    <div class="row">
      <div class="switch">
        <input type="checkbox" id="notify" role="switch">
        <label class="track" for="notify" aria-hidden="true"></label>
        <span class="state" id="notifyState">Notifications off</span>
      </div>
      <button id="test" type="button">Send a test notification</button>
      <label class="c"><input type="checkbox" id="sound"> beep too</label>
      <label class="f">Check every
        <select id="every">
          <option value="15">15 seconds</option>
          <option value="30" selected>30 seconds</option>
          <option value="60">60 seconds</option>
        </select>
      </label>
    </div>
    <div class="status" id="status" role="status">Starting…</div>
    <div class="warn" id="permWarn" hidden></div>
  </section>

  <section class="card" aria-label="What to wait for">
    <div class="row">
      <label class="f">CPU name contains (text or regex)
        <input type="text" id="cpu" spellcheck="false" placeholder="e.g. Threadripper PRO (9995|7995)WX">
      </label>
      <label class="f">Min threads <input type="number" id="minThreads" min="0" step="1"></label>
      <label class="f">Min RAM (GB) <input type="number" id="minRam" min="0" step="1"></label>
      <label class="f">Max $ per hour <input type="number" id="maxPrice" min="0" step="0.05"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="c"><input type="checkbox" id="whole"> whole machine only (not shared)</label>
      <label class="c"><input type="checkbox" id="verified"> verified hosts only</label>
      <label class="c"><input type="checkbox" id="reliable"> reliability above 0.98</label>
    </div>
    <div class="presets">
      <button type="button" data-preset="best">Cheapest class: Threadripper PRO 9995WX / 7995WX</button>
      <button type="button" data-preset="tr">Any Threadripper, 120+ threads</button>
      <button type="button" data-preset="big">Anything with 180+ threads under $1.50/h</button>
    </div>
  </section>

  <section class="card" aria-label="Matching machines">
    <div id="summary" style="margin-bottom:8px"><strong id="count">0</strong> matching machines
      <small id="of"></small></div>
    <div id="tableWrap"></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DEFAULTS = { cpu: "Threadripper PRO (9995|7995)WX", minThreads: 150, minRam: 100, maxPrice: 3,
                   whole: true, verified: true, reliable: true, every: 30, notify: false, sound: false };
const PRESETS = {
  best: { cpu: "Threadripper PRO (9995|7995)WX", minThreads: 150, minRam: 100, maxPrice: 3 },
  tr:   { cpu: "Threadripper", minThreads: 120, minRam: 60, maxPrice: 4 },
  big:  { cpu: "", minThreads: 180, minRam: 100, maxPrice: 1.5 },
};

function load() {
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("vastWatch") || "{}")); }
  catch (e) { return Object.assign({}, DEFAULTS); }
}
function save() {
  try { localStorage.setItem("vastWatch", JSON.stringify(settings)); } catch (e) { /* private window: fine */ }
}
const settings = load();

function readForm() {
  settings.cpu = $("cpu").value.trim();
  settings.minThreads = Number($("minThreads").value) || 0;
  settings.minRam = Number($("minRam").value) || 0;
  settings.maxPrice = Number($("maxPrice").value) || 0;
  settings.whole = $("whole").checked;
  settings.verified = $("verified").checked;
  settings.reliable = $("reliable").checked;
  settings.every = Number($("every").value) || 30;
  settings.sound = $("sound").checked;
  save();
}
function writeForm() {
  $("cpu").value = settings.cpu; $("minThreads").value = settings.minThreads;
  $("minRam").value = settings.minRam; $("maxPrice").value = settings.maxPrice;
  $("whole").checked = settings.whole; $("verified").checked = settings.verified;
  $("reliable").checked = settings.reliable; $("every").value = String(settings.every);
  $("sound").checked = settings.sound;
}

function cpuMatcher() {
  const t = settings.cpu;
  if (!t) return () => true;
  try { const re = new RegExp(t, "i"); return (s) => re.test(s || ""); }
  catch (e) { const low = t.toLowerCase(); return (s) => (s || "").toLowerCase().includes(low); }
}
function matches(o, cpuOk) {
  return cpuOk(o.cpu_name) && (o.threads || 0) >= settings.minThreads && (o.ram_gb || 0) >= settings.minRam &&
    (!settings.maxPrice || o.dph_total <= settings.maxPrice) &&
    (!settings.whole || (o.gpu_frac || 0) >= 1) &&
    (!settings.verified || o.verification === "verified") &&
    (!settings.reliable || (o.reliability2 || 0) > 0.98);
}
// Can our launcher (python/launcher/launch.py) rent it? Whole machine, verified, reliable, network price at most 0.10 $/GB.
function launcherOk(o) {
  return (o.gpu_frac || 0) >= 1 && o.verification === "verified" && (o.reliability2 || 0) > 0.98 &&
    (o.inet_down_cost || 0) <= 0.1 && (o.inet_up_cost || 0) <= 0.1;
}
function cleanCpu(s) {
  return (s || "?").replace(/^AMD\s+Ryzen\s+/i, "AMD ").replace(/\s+\d+-Core(s)?( Processor)?\s*$/i, "").replace(/\s+Processor\s*$/i, "").trim();
}

let seen = null;          // ids of matches at the last check; null until the first successful check
let timer = null;
let lastIds = new Set();

function describe(o) {
  return cleanCpu(o.cpu_name) + " · " + o.threads + " threads · " + Math.round(o.ram_gb) + " GB RAM · $" +
    o.dph_total.toFixed(2) + "/h · " + (o.geolocation || "?") + " (offer " + o.id + ")";
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = 880; g.gain.value = 0.08; osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.25);
  } catch (e) { /* no sound: fine */ }
}

function notify(title, body, tag) {
  if (!settings.notify || !("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(title, { body: body, tag: tag, requireInteraction: true }); } catch (e) { /* ignore */ }
  if (settings.sound) beep();
}

function render(matched, total, newIds) {
  $("count").textContent = String(matched.length);
  $("of").textContent = total ? "(of " + total + " machines on the market)" : "";
  const wrap = $("tableWrap");
  wrap.textContent = "";
  if (!matched.length) {
    const d = document.createElement("div"); d.className = "empty";
    d.textContent = "Nothing matches right now. This page keeps checking.";
    wrap.appendChild(d); return;
  }
  const tbl = document.createElement("table");
  const head = document.createElement("tr");
  [["Machine", ""], ["Threads", "n"], ["RAM", "n"], ["$ per hour", "n"], ["Reliability", "n"], ["GPU (ignored)", ""],
   ["Where", ""], ["Offer", "n"], ["Our launcher can rent it", ""]].forEach(([h, c]) => {
    const th = document.createElement("th"); th.textContent = h; if (c) th.className = c; head.appendChild(th);
  });
  tbl.appendChild(head);
  matched.forEach((o) => {
    const tr = document.createElement("tr");
    if (newIds.has(o.id)) tr.className = "new";
    const cell = (text, cls) => { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); return td; };
    const m = cell(cleanCpu(o.cpu_name));
    if (newIds.has(o.id)) { const b = document.createElement("span"); b.className = "badge"; b.textContent = "NEW"; m.appendChild(b); }
    cell(String(o.threads), "n"); cell(Math.round(o.ram_gb) + " GB", "n"); cell("$" + o.dph_total.toFixed(2), "n");
    cell((o.reliability2 || 0).toFixed(3), "n");
    cell((o.num_gpus || 0) + "× " + (o.gpu_name || "?") + ((o.gpu_frac || 0) < 1 ? " (shared)" : ""));
    cell(o.geolocation || "?"); cell(String(o.id), "n");
    const ok = launcherOk(o); cell(ok ? "yes" : "no (" + (o.verification !== "verified" ? "not verified" : (o.gpu_frac || 0) < 1 ? "shared" : "check price/reliability") + ")", ok ? "ok" : "no");
    tbl.appendChild(tr);
  });
  wrap.appendChild(tbl);
}

async function check() {
  readForm();
  const st = $("status");
  try {
    const r = await fetch("/api/offers", { cache: "no-store" });
    if (!r.ok) throw new Error("the watcher program answered " + r.status);
    const data = await r.json();
    const cpuOk = cpuMatcher();
    const matched = data.offers.filter((o) => matches(o, cpuOk)).sort((a, b) => a.dph_total - b.dph_total);
    const ids = new Set(matched.map((o) => o.id));
    const newIds = new Set();
    if (seen !== null) matched.forEach((o) => { if (!seen.has(o.id)) newIds.add(o.id); });
    if (newIds.size) {
      const list = matched.filter((o) => newIds.has(o.id));
      if (list.length <= 3) list.forEach((o) => notify("New match on vast.ai", describe(o), "vast-" + o.id));
      else notify(list.length + " new matches on vast.ai", list.slice(0, 3).map(describe).join("\n") + "\n…", "vast-many");
    }
    seen = ids; lastIds = ids;
    render(matched, data.count, newIds);
    document.title = (matched.length ? "(" + matched.length + ") " : "") + "Vast machine watcher";
    const t = new Date().toLocaleTimeString();
    st.className = "status" + (data.error ? " err" : "");
    st.textContent = data.error ? "vast.ai did not answer (" + data.error + "); showing the last list. Checked " + t + "."
      : "Last checked " + t + " · next check in up to " + settings.every + " s · " + data.count + " machines on the market · " + matched.length + " match.";
  } catch (e) {
    st.className = "status err";
    st.textContent = "Cannot reach the watcher program (" + e.message + "). Is watch.py still running?";
  }
}

function schedule() {
  if (timer) clearInterval(timer);
  timer = setInterval(check, settings.every * 1000);
}

function setNotifyUi() {
  $("notify").checked = settings.notify;
  $("notifyState").textContent = settings.notify ? "Notifications ON" : "Notifications off";
  const w = $("permWarn");
  if (!("Notification" in window)) { w.hidden = false; w.textContent = "This browser does not support desktop notifications."; }
  else if (Notification.permission === "denied") {
    w.hidden = false;
    w.textContent = "The browser is blocking notifications for this page. Click the lock icon next to the address, set Notifications to Allow, then switch on again.";
  } else w.hidden = true;
}

$("notify").addEventListener("change", async () => {
  if ($("notify").checked) {
    if (!("Notification" in window)) { $("notify").checked = false; setNotifyUi(); return; }
    if (Notification.permission === "default") { try { await Notification.requestPermission(); } catch (e) { /* ignore */ } }
    settings.notify = Notification.permission === "granted";
    if (settings.notify) notify("Notifications are on", "You will be told when a new machine matches.", "vast-on");
  } else settings.notify = false;
  save(); setNotifyUi();
});
$("test").addEventListener("click", async () => {
  if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch (e) { /* ignore */ } }
  setNotifyUi();
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const was = settings.notify; settings.notify = true;
  notify("Test notification", "This is what a new match will look like.", "vast-test");
  settings.notify = was;
});
["cpu", "minThreads", "minRam", "maxPrice", "whole", "verified", "reliable", "sound"].forEach((id) =>
  $(id).addEventListener("change", () => { readForm(); seen = null; check(); }));
$("cpu").addEventListener("input", () => { readForm(); });
$("every").addEventListener("change", () => { readForm(); schedule(); });
document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
  Object.assign(settings, PRESETS[b.dataset.preset]); writeForm(); save(); seen = null; check();
}));

writeForm(); setNotifyUi();
if (settings.notify && (!("Notification" in window) || Notification.permission !== "granted")) { settings.notify = false; save(); setNotifyUi(); }
check(); schedule();
</script>
</body>
</html>
