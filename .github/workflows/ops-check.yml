name: ops-check

# Manual, read-mostly check that the repository's variables and secrets reach R2 and vast.ai.
# Writes one tiny marker object under ops-check/ in the bucket and reads it back.

on:
  workflow_dispatch:

jobs:
  r2:
    name: R2 bucket access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Check inputs are set
        shell: bash
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty"; exit 1; fi
          done
          echo "endpoint=$R2_ENDPOINT bucket=$R2_BUCKET"
      - name: Write marker, list, read back
        shell: bash
        run: |
          set -euo pipefail
          echo "ops-check run ${{ github.run_id }} at $(date -u +%FT%TZ)" > marker.txt
          aws s3 cp marker.txt "s3://$R2_BUCKET/ops-check/run-${{ github.run_id }}.txt" --endpoint-url "$R2_ENDPOINT"
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" --recursive --summarize | tail -5
          aws s3 cp "s3://$R2_BUCKET/ops-check/run-${{ github.run_id }}.txt" back.txt --endpoint-url "$R2_ENDPOINT"
          diff marker.txt back.txt && echo "R2 round trip OK"

  vast:
    name: vast.ai account and offers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - name: Check input is set
        shell: bash
        run: |
          if [ -z "$VAST_API_KEY" ]; then echo "::error::VAST_API_KEY is empty"; exit 1; fi
      - name: Install the vast.ai CLI
        run: pip install --quiet vastai
      - name: Account (balance and limits)
        shell: bash
        run: |
          set -euo pipefail
          vastai show user --raw | python3 -c 'import json,sys; u=json.load(sys.stdin); print({k:u.get(k) for k in ("id","username","balance","credit","balance_threshold","billaddress_country") if k in u})'
      - name: Cheapest on-demand offers matching the plan's filters
        shell: bash
        run: |
          set -euo pipefail
          vastai search offers 'reliability>0.98 num_gpus=1 gpu_frac=1 cpu_cores_effective>=16 cpu_ram>=32 compute_cap>=600 compute_cap<1000 cuda_vers>=12.6 rentable=true' --order 'dph_total' --limit 8 --raw \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin)
          for o in rows: print(f"{o.get(\"id\")}: ${o.get(\"dph_total\"):.3f}/h  {o.get(\"gpu_name\")}  cores_eff={o.get(\"cpu_cores_effective\")}  ram={o.get(\"cpu_ram\")}MB  {o.get(\"cpu_name\")}  rel={o.get(\"reliability2\"):.3f}  down=${o.get(\"inet_down_cost\")}/GB up=${o.get(\"inet_up_cost\")}/GB")'
          echo "No instance was created."
