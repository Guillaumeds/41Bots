name: vast-run

# Rents one ON-DEMAND vast.ai machine (never interruptible), runs one manifest with the prebuilt
# binaries of `bin_sha`, watches it through the vast API and the R2 heartbeat (no SSH), destroys
# it, and uploads a cost report to R2 runs/<run_id>/report.json.
# Format 1 (M1): one chunk. Format 2 (docs/M3-SPEC.md section 7): prioritised streams of chunks;
# if the machine dies or its heartbeat stops, the launcher rents a replacement that resumes from
# the done-list (at most 3). Format-2 inputs must be in R2 first (launch.py put-input FILE).
# If the chosen offer is taken before it can be rented, the next-best offer is tried.
# Set dry_run to only print the offer that would be chosen.
# Runs longer than this job's 6-hour limit: after 330 minutes the launcher hands the machine over
# (it keeps working until DONE, its deadline from max_minutes, or max_dollars) and vast-cleanup.yml
# watches it every 15 minutes; runs/<run_id>/closed.json records how it ended.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest JSON, or a path in the repo"
        required: true
        default: '{"run_id": "", "chunk": {"equity_sweep": {"bot": "rules-v1", "hands": 200000, "seed": 1}}}'
      min_cores:
        description: "Minimum effective CPU cores"
        default: "16"
      max_minutes:
        description: "Hard time limit (minutes) for the run, which may exceed GitHub's 6 hours (the machine is handed over to vast-cleanup at 330 min)"
        default: "30"
      cpu_only:
        description: "CPU-only job: ignore the GPU type when choosing a machine"
        type: boolean
        default: true
      low_cpu_pct:
        description: "Low-CPU watchdog threshold in % (default 85; lower only for runs with known serial tails)"
        default: "85"
      low_cpu_s:
        description: "Seconds of CPU below low_cpu_pct before the machine is stopped and destroyed (default 300)"
        default: "300"
      poll_s:
        description: "Seconds between the launcher's checks of the machine (default 60)"
        default: "60"
      max_dollars:
        description: "Budget in dollars: stop (upload what is finished) and destroy once the run's machines cost this much (0 = no limit)"
        default: "0"
      cpu_match:
        description: "Regex the offer's CPU name must match, e.g. EPYC (blank = any)"
        default: ""
      bin_sha:
        description: "Commit whose release binaries to run (default: this commit)"
        default: ""
      image:
        description: "Base image, e.g. ghcr.io/guillaumeds/41bots-base:20261013-abcdef123456"
        required: true
      cheapest:
        description: "Pick the lowest $/hour offer (test runs) instead of best cost per unit of work"
        type: boolean
        default: true
      dry_run:
        description: "Only search and print the chosen offer; rent nothing"
        type: boolean
        default: true
      offer_id:
        description: "Rent exactly this vast.ai offer number, with NO search and none of the filters (blank = normal search). Needs offer_dph and offer_cores."
        default: ""
      offer_dph:
        description: "With offer_id: the offer's price per hour as shown on vast.ai"
        default: ""
      offer_cores:
        description: "With offer_id: its CPU cores as shown on vast.ai (e.g. 384)"
        default: ""
      market_check:
        description: "Only check the market for a second machine comparable to the Threadripper PRO 9995WX: prints YES/NO with offer details at the top of the run page; rents nothing (type any text in image)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vast-run-${{ github.run_id }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the vast.ai CLI
        run: pip install --quiet "vastai==1.8.3"
      - name: Launch, watch, destroy
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
          MIN_CORES: ${{ inputs.min_cores }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          LOW_CPU_PCT: ${{ inputs.low_cpu_pct }}
          LOW_CPU_S: ${{ inputs.low_cpu_s }}
          POLL_S: ${{ inputs.poll_s }}
          MAX_DOLLARS: ${{ inputs.max_dollars }}
          CPU_MATCH: ${{ inputs.cpu_match }}
          IMAGE: ${{ inputs.image }}
          BIN_SHA: ${{ inputs.bin_sha || github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          MARKET_CHECK: ${{ inputs.market_check }}
          OFFER_ID: ${{ inputs.offer_id }}
          OFFER_DPH: ${{ inputs.offer_dph }}
          OFFER_CORES: ${{ inputs.offer_cores }}
        run: |
          set -euo pipefail
          if [ "$MARKET_CHECK" = "true" ]; then
            python3 python/tools/vast_status.py --market-only --color off
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python3 python/launcher/launch.py plan --min-cores "$MIN_CORES" --cpu-match "$CPU_MATCH" ${{ inputs.cpu_only && '--cpu-only' || '' }} ${{ inputs.cheapest && '--cheapest' || '' }}
            exit 0
          fi
          # A blank run_id gets a timestamp from the launcher.
          MANIFEST=$(python3 -c 'import json,os,sys; t=os.environ["MANIFEST"]; m=json.loads(t if t.lstrip().startswith("{") else open(t).read()); m["run_id"]=m.get("run_id") or "gh-${{ github.run_id }}"; print(json.dumps(m))')
          python3 python/launcher/launch.py run --manifest "$MANIFEST" --min-cores "$MIN_CORES" --cpu-match "$CPU_MATCH" ${{ inputs.cpu_only && '--cpu-only' || '' }} \
            --max-minutes "$MAX_MINUTES" --low-cpu-pct "$LOW_CPU_PCT" --low-cpu-s "${LOW_CPU_S:-300}" --poll-s "${POLL_S:-60}" --max-dollars "${MAX_DOLLARS:-0}" \
            --image "$IMAGE" --bin-sha "$BIN_SHA" --state-file instance-id.txt ${{ inputs.cheapest && '--cheapest' || '' }} --handover-min 330 \
            $( [ -n "$OFFER_ID" ] && echo "--offer-id $OFFER_ID --offer-dph $OFFER_DPH --offer-cores $OFFER_CORES" )
      - name: Cancelled - ask the run to stop and wait (at most 5 minutes) for it to upload what it finished
        if: cancelled() && hashFiles('instance-id.txt.run-id') != ''
        shell: bash
        run: python3 python/launcher/launch.py stop "$(cat instance-id.txt.run-id)" --instance "$(cat instance-id.txt)" --wait-s 300 --reason "workflow cancelled" || true
      - name: Safety net - destroy the instance if the job was cancelled or failed
        if: always() && hashFiles('instance-id.txt') != ''
        shell: bash
        run: python3 python/launcher/launch.py destroy "$(cat instance-id.txt)" || true
      - name: Safety net - delete the run's destroy-only API key if the launcher did not
        if: always() && hashFiles('instance-id.txt.destroy-key') != ''
        shell: bash
        run: python3 python/launcher/launch.py delete-key "$(cat instance-id.txt.destroy-key)" || true
