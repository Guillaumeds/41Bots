name: vast-run

# Rents one ON-DEMAND vast.ai machine (never interruptible), runs one manifest with the prebuilt
# binaries of `bin_sha`, watches it through the vast API and the R2 heartbeat (no SSH), destroys
# it, and uploads a cost report to R2 runs/<run_id>/report.json.
# Format 1 (M1): one chunk. Format 2 (docs/M3-SPEC.md section 7): prioritised streams of chunks;
# if the machine dies or its heartbeat stops, the launcher rents a replacement that resumes from
# the done-list (at most 3). Format-2 inputs must be in R2 first (launch.py put-input FILE).
# If the chosen offer is taken before it can be rented, the next-best offer is tried.
# Set dry_run to only print the offer that would be chosen.
# GPU jobs (network training, docs/m3-hybrid/vast.md): a manifest's top-level "machine" object
# ({"gpus": 1, "min_gpu_ram_gb": 4, "min_cores": 128, "disk_gb": 80}) or the gpus /
# min_gpu_ram_gb / disk_gb inputs; a GPU need overrides cpu_only.
# Runs longer than this job's 6-hour limit: after 330 minutes the launcher hands the machine over
# (it keeps working until DONE or max_dollars, or a deadline only if max_minutes was set) and
# vast-cleanup.yml watches it every 15 minutes; runs/<run_id>/closed.json records how it ended.
# No time limit by default (owner, 2026-10-16): a run ends when it finishes, at its dollar cap
# (max_dollars, $20 by default), or when a person stops it.
# Verified hosts are preferred (owner, 2026-10-16): when no verified offer fits, unverified or
# deverified hosts are searched too; verified_only keeps the strict behaviour.
# Big image, slow downlinks (2026-10-16): the launcher gives a machine that is still pulling the image
# more time while vast's status shows the pull advancing (at most 40 minutes from renting; a status
# unchanged for 10 minutes ends it), counts the 15 minutes to the first heartbeat from the container
# start, and only searches hosts reporting a download speed of at least 100 Mbps (launch.py
# --min-inet-down, default 100). This workflow has no input for those (25-input limit); the defaults apply,
# and a manifest's "machine" object can set them for one run: min_inet_down (Mbps; 0 = no filter), max_dph,
# wait_for_offer_min, offer_poll_s, price_steps, tries_per_step, gpu_names (a list of GPU model names as vast reports
# them in an offer's gpu_name, like ["RTX 4090", "RTX 5090"]: no other model is rented; launch.py --gpu-names).
# Looking for a machine (owner, 2026-10-16): at least 190 threads (min_cores), at most $1.70/h; when none matches the launcher
# waits instead of failing, up to 2 hours, searching every minute at $1.20/h, then $1.45/h, then $1.70/h (3 tries each), and a
# replacement search after a start failure does the same with the same floors. The wait and the price steps are launch.py
# options (--wait-for-offer-min, --offer-poll-s, --price-steps, --tries-per-step, --max-dph) and manifest machine keys, not
# inputs: the workflow is near GitHub's limit of 25 inputs. A machine whose container did not start is left out of every search for 24 hours.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest JSON, or a path in the repo"
        required: true
        default: '{"run_id": "", "chunk": {"equity_sweep": {"bot": "rules-v1", "hands": 200000, "seed": 1}}}'
      min_cores:
        description: "Minimum effective CPU cores (threads). Default 190 (owner, 2026-10-16): the launcher waits for such a machine, up to 2 hours, rather than rent a smaller one. A manifest's machine block can raise it"
        default: "190"
      min_ram_gb:
        description: "Minimum RAM in GB (e.g. 480 for the one-deal-per-thread table measurement)"
        default: "32"
      min_reliability:
        description: "Host reliability floor (default 0.90, the owner's rule of 2026-10-16); raise it for a run that wants a steadier host"
        default: "0.90"
      max_minutes:
        description: "Time limit in minutes, only if you want one (0 = none, the default: the run ends when it finishes or at max_dollars). Runs past 330 min are handed over to vast-cleanup"
        default: "0"
      cpu_only:
        description: "CPU-only job: ignore the GPU type when choosing a machine"
        type: boolean
        default: true
      gpus:
        description: "GPU job (network training): at least this many GPUs (a 2-GPU box is fine, the trainer uses one), with the PyTorch cu126 filters: compute capability 6.0 or newer and below 10.0, a driver that supports CUDA 12.6. Blackwell cards (10.0 and above: RTX 50-series, B200; the cu130 build) are opt-in per run: the manifest's machine.blackwell: true (see docs/vast/cu130-smoke.manifest.json), then a driver that supports CUDA 13.0 (0 = as the manifest's machine.gpus says, none otherwise)"
        default: "0"
      min_gpu_ram_gb:
        description: "GPU job: memory per GPU in GB (0 = as the manifest says)"
        default: "0"
      disk_gb:
        description: "Container disk in GB (default 20; a hybrid rung needs about 80: the GPU PyTorch build and the label shards)"
        default: "20"
      low_cpu_pct:
        description: "Low-CPU watchdog threshold in % (default 85; lower only for runs with known serial tails)"
        default: "85"
      low_cpu_s:
        description: "Seconds of CPU below low_cpu_pct before the machine is stopped and destroyed (default 300)"
        default: "300"
      poll_s:
        description: "Seconds between the launcher's checks of the machine (default 60)"
        default: "60"
      max_dollars:
        description: "Dollar cap: stop (upload what is finished) and destroy once the run's machines cost this much (default 20; 0 = no limit)"
        default: "20"
      cpu_match:
        description: "Regex the offer's CPU name must match, e.g. EPYC (blank = any)"
        default: ""
      verified_only:
        description: "Rent only from vast.ai-verified hosts. Off (the default): verified hosts are preferred, and when no verified offer fits, unverified or deverified hosts are searched too (owner rule 2026-10-16)"
        type: boolean
        default: false
      bin_sha:
        description: "Commit whose release binaries to run (default: this commit)"
        default: ""
      image:
        description: "Base image, e.g. ghcr.io/guillaumeds/41bots-base:20261013-abcdef123456"
        required: true
      cheapest:
        description: "Off (the default): the launcher ranks offers by cost per unit of CPU work and takes the fastest within 20% of the best. On: the lowest $/hour offer instead, whatever its speed (test runs only)"
        type: boolean
        default: false
      dry_run:
        description: "Only search and print the chosen offer; rent nothing"
        type: boolean
        default: true
      offer_id:
        description: "Rent exactly this vast.ai offer number (blank = normal search): one search by its id checks it (reliability >= 0.90, whole machine, on-demand; an unverified or deverified host is accepted unless verified_only is on); an offer failing a check is not rented. With dry_run: prints the offer, rents nothing."
        default: ""
      offer_dph:
        description: "With offer_id (optional): the price per hour you saw on vast.ai; a warning if vast reports another"
        default: ""
      offer_cores:
        description: "With offer_id (optional): the CPU cores you saw on vast.ai (e.g. 384); a warning if vast reports another"
        default: ""
      resume_from:
        description: "Format 1 only: the run id whose out/ (or partial/out/) this run continues from (search_measure chunks resume world by world; refused if the settings differ). Put into the manifest unless it already has resume_from."
        default: ""
      market_check:
        description: "Only check the market for a second machine comparable to the Threadripper PRO 9995WX: prints YES/NO with offer details at the top of the run page; rents nothing (type any text in image)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vast-run-${{ github.run_id }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the vast.ai CLI
        run: pip install --quiet "vastai==1.8.3"
      - name: Launch, watch, destroy
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
          MIN_CORES: ${{ inputs.min_cores }}
          MIN_RAM_GB: ${{ inputs.min_ram_gb }}
          MIN_RELIABILITY: ${{ inputs.min_reliability }}
          GPUS: ${{ inputs.gpus }}
          MIN_GPU_RAM_GB: ${{ inputs.min_gpu_ram_gb }}
          DISK_GB: ${{ inputs.disk_gb }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          LOW_CPU_PCT: ${{ inputs.low_cpu_pct }}
          LOW_CPU_S: ${{ inputs.low_cpu_s }}
          POLL_S: ${{ inputs.poll_s }}
          MAX_DOLLARS: ${{ inputs.max_dollars }}
          CPU_MATCH: ${{ inputs.cpu_match }}
          IMAGE: ${{ inputs.image }}
          BIN_SHA: ${{ inputs.bin_sha || github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          MARKET_CHECK: ${{ inputs.market_check }}
          OFFER_ID: ${{ inputs.offer_id }}
          OFFER_DPH: ${{ inputs.offer_dph }}
          OFFER_CORES: ${{ inputs.offer_cores }}
          RESUME_FROM: ${{ inputs.resume_from }}
        run: |
          set -euo pipefail
          if [ "$MARKET_CHECK" = "true" ]; then
            python3 python/tools/vast_status.py --market-only --color off
            exit 0
          fi
          # --offer-id: the one offer the owner named, checked by id (no other search); blank: the normal search.
          OFFER_ARGS=""
          if [ -n "$OFFER_ID" ]; then
            OFFER_ARGS="--offer-id $OFFER_ID ${OFFER_DPH:+--offer-dph $OFFER_DPH} ${OFFER_CORES:+--offer-cores $OFFER_CORES}"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            # Prints the offer that would be rented (the named one with offer_id, else the search's choice); rents nothing.
            # The manifest's "machine" needs (GPUs, cores, disk) apply to the plan too.
            python3 python/launcher/launch.py plan --manifest "$MANIFEST" --min-cores "$MIN_CORES" --min-ram-gb "${MIN_RAM_GB:-32}" --min-reliability "${MIN_RELIABILITY:-0.90}" --cpu-match "$CPU_MATCH" ${{ inputs.cpu_only && '--cpu-only' || '' }} ${{ inputs.cheapest && '--cheapest' || '' }} ${{ inputs.verified_only && '--verified-only' || '' }} \
              --gpus "${GPUS:-0}" --min-gpu-ram-gb "${MIN_GPU_RAM_GB:-0}" --disk-gb "${DISK_GB:-20}" $OFFER_ARGS
            exit 0
          fi
          # A blank run_id gets a timestamp from the launcher; resume_from goes into the manifest unless it has one.
          MANIFEST=$(python3 - <<'PY'
          import json, os, sys
          t = os.environ["MANIFEST"]
          m = json.loads(t if t.lstrip().startswith("{") else open(t).read())
          m["run_id"] = m.get("run_id") or "gh-${{ github.run_id }}"
          r = os.environ.get("RESUME_FROM", "").strip()
          chunk = m.get("chunk") if isinstance(m.get("chunk"), dict) else {}
          has = m.get("resume_from") or any(isinstance(p, dict) and p.get("resume_from") for p in chunk.values())
          if r and not has:
              m["resume_from"] = r
          elif r and has:
              print(f"::warning::resume_from input {r!r} ignored: the manifest already has one", file=sys.stderr)
          print(json.dumps(m))
          PY
          )
          python3 python/launcher/launch.py run --manifest "$MANIFEST" --min-cores "$MIN_CORES" --min-ram-gb "${MIN_RAM_GB:-32}" --min-reliability "${MIN_RELIABILITY:-0.90}" --cpu-match "$CPU_MATCH" ${{ inputs.cpu_only && '--cpu-only' || '' }} \
            --max-minutes "${MAX_MINUTES:-0}" --low-cpu-pct "$LOW_CPU_PCT" --low-cpu-s "${LOW_CPU_S:-300}" --poll-s "${POLL_S:-60}" --max-dollars "${MAX_DOLLARS:-20}" \
            --image "$IMAGE" --bin-sha "$BIN_SHA" --state-file instance-id.txt ${{ inputs.cheapest && '--cheapest' || '' }} ${{ inputs.verified_only && '--verified-only' || '' }} --handover-min 330 \
            --gpus "${GPUS:-0}" --min-gpu-ram-gb "${MIN_GPU_RAM_GB:-0}" --disk-gb "${DISK_GB:-20}" \
            $OFFER_ARGS
      - name: Cancelled - ask the run to stop and wait (at most 5 minutes) for it to upload what it finished
        if: cancelled() && hashFiles('instance-id.txt.run-id') != ''
        shell: bash
        run: python3 python/launcher/launch.py stop "$(cat instance-id.txt.run-id)" --instance "$(cat instance-id.txt)" --wait-s 300 --reason "workflow cancelled" || true
      - name: Safety net - destroy the instance if the job was cancelled or failed
        if: always() && hashFiles('instance-id.txt') != ''
        shell: bash
        run: python3 python/launcher/launch.py destroy "$(cat instance-id.txt)" || true
      - name: Safety net - delete the run's destroy-only API key if the launcher did not
        if: always() && hashFiles('instance-id.txt.destroy-key') != ''
        shell: bash
        run: python3 python/launcher/launch.py delete-key "$(cat instance-id.txt.destroy-key)" || true
