name: image

# Builds the public, secret-free base image (deploy/docker) and pushes it to GHCR as
# ghcr.io/<owner>/41bots-base:<date>-<sha>. Never `latest`.

on:
  workflow_dispatch:
  push:
    tags: ["image-*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        shell: bash
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/$owner/41bots-base:$(date -u +%Y%m%d)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -f deploy/docker/Dockerfile -t "${{ steps.tag.outputs.ref }}" .
          docker run --rm --entrypoint sh "${{ steps.tag.outputs.ref }}" -c 'rclone version | head -1 && vastai --help >/dev/null && uv --version && id && du -sh "$UV_CACHE_DIR"'
          docker push "${{ steps.tag.outputs.ref }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${{ steps.tag.outputs.ref }}")
          echo "pushed ${{ steps.tag.outputs.ref }} ($digest). Make the package public once in GitHub > Packages." | tee -a "$GITHUB_STEP_SUMMARY"
