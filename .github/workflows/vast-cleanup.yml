# Run-aware safety net for vast.ai machines labelled "41bots-" (python/launcher/cleanup.py).
# A healthy run is never touched, however long it lasts. A machine is destroyed when its run
# ended (DONE/FAILED) 10 minutes ago, went 20 minutes without a heartbeat or never heartbeated in
# 45 minutes (a silent machine vast shows busy is asked to stop and upload first, and destroyed
# 15 minutes later if still silent), is exited/offline, is 30 minutes past its deadline, or passed
# its dollar cap (asked to stop and upload first, destroyed 15 minutes later). Every destroy needs
# a second reading of the machine from vast; an unreadable answer never destroys. It also takes over the watching
# of runs the launcher handed over at GitHub's 6-hour limit. Owner-approved (2026-10-15); replaces
# the age-based rule that destroyed every machine older than 2 hours.
name: vast-cleanup
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Destroy every 41bots- instance regardless of its run"
        type: boolean
        default: false
      dry_run:
        description: "Only print what would be done"
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: vast-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the vast.ai CLI
        run: pip install --quiet "vastai==1.8.3"
      - name: Check every 41bots- machine against its run
        shell: bash
        run: |
          set -euo pipefail
          python3 python/launcher/cleanup.py ${{ inputs.all && '--all' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
          vastai show instances --api-key "$VAST_API_KEY" || true
