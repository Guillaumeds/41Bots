[package]
name = "tablemgr"
version = "0.1.0"
description = "The 41 table: runs a match for eight seat agents, the observation filter checks, game records and the networked line protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# docs/M1-SPEC.md §1: engine, bot, serde (derive) and serde_json only; the network uses std::net.
[dependencies]
engine = { path = "../engine", features = ["serde"] }
bot = { path = "../bot" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
