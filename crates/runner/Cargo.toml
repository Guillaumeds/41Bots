[package]
name = "runner"
version = "0.2.0"
description = "Run-ops runner: format-1 single chunks (docs/M1-SPEC.md section 7) and format-2 multi-stream runs with resume (docs/M3-SPEC.md section 7)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Most chunk kinds run in the sibling release binaries as child processes. The runner links
# `engine` (chunk seeds by `Rng::derive`), `arena` (the sequential-test decision over the finished
# prefix, and the `arena_blocks` worker), `search` (its bot registry, so `pimc-*` bots play in
# `arena_blocks`) and `solver` (its transposition tables' memory model, to size them), so each of
# those stays one implementation.
[dependencies]
serde_json = "1"
engine = { path = "../engine" }
arena = { path = "../arena" }
search = { path = "../search" }
nn = { path = "../nn" }
solver = { path = "../solver" }
sha2 = "0.11.1"
zstd = { version = "0.14.2", default-features = false }

# SIGTERM / SIGINT / SIGHUP set a flag (`signal_hook::flag::register`, a safe function), so a
# stopped run uploads what it finished before it exits (`stop.rs`).
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3.18", default-features = false }

[[bin]]
name = "runner"
path = "src/main.rs"

[lints]
workspace = true
