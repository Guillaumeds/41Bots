[package]
name = "runner"
version = "0.2.0"
description = "Run-ops runner: format-1 single chunks (docs/M1-SPEC.md section 7) and format-2 multi-stream runs with resume (docs/M3-SPEC.md section 7)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Most chunk kinds run in the sibling release binaries as child processes. The runner links
# `engine` (chunk seeds by `Rng::derive`) and `arena` + `bots` (the `arena_blocks` worker and the
# sequential-test decision over the finished prefix), so those stay one implementation.
[dependencies]
serde_json = "1"
engine = { path = "../engine" }
arena = { path = "../arena" }
bots = { path = "../bots" }
sha2 = "0.11.1"
zstd = { version = "0.14.2", default-features = false }

[[bin]]
name = "runner"
path = "src/main.rs"

[lints]
workspace = true
